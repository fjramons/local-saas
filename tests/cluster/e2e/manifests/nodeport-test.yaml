# Deployment + NodePort Service used by tests/cluster/e2e/run-tests.sh to
# test --port-map: the fixed nodePort (30080) is mapped to a host port with
# 'saas cluster create -p HOSTPORT:30080', and the host is curled to confirm
# traffic genuinely reaches the pod (not just that the extraPortMappings YAML
# was generated without errors). Reusable by hand:
#   kubectl --context kind-<name> apply -f nodeport-test.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
