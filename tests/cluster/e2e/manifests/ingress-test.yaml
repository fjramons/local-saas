# Deployment + ClusterIP Service + Ingress used by tests/cluster/e2e/run-tests.sh
# to test --expose-mode ingress-nginx: the controller listens on the
# control-plane node's hostPort 80/443 (mapped by 'saas cluster create' to the
# host's own 80/443), and the host is curled with a Host header to confirm
# traffic genuinely reaches the pod through the Ingress. Reusable by hand:
#   kubectl --context kind-<name> apply -f ingress-test.yaml
#   curl -H "Host: test.local" http://localhost/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: nginx
  rules:
    - host: test.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
